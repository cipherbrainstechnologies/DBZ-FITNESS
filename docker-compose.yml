services:
  postgres:
    image: postgres:16
    container_name: saiyan-ascend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saiyan
      POSTGRES_PASSWORD: saiyan
      POSTGRES_DB: saiyan_ascend
    ports:
      - "5432:5432"
    volumes:
      - saiyan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saiyan -d saiyan_ascend"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: saiyan-ascend-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - saiyan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  saiyan_postgres_data:
  saiyan_redis_data:
