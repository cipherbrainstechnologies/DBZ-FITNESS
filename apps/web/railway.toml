# Template only — NOT deployed. Wire this service in the Railway dashboard
# with Root Directory empty (monorepo root) and Config path = /apps/web/railway.toml
# or set RAILWAY_DOCKERFILE_PATH=apps/web/Dockerfile on the service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/contracts/**",
  "packages/design-tokens/**",
  "pnpm-lock.yaml",
  "package.json",
]

[deploy]
startCommand = "pnpm exec next start --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
